# nginx 反向代理：唯一入口。
# 职责：
#  1. Basic Auth（Iris RPC 无鉴权，必须挡在前面）
#  2. 把 Host/Origin 改写为 127.0.0.1 —— iris 的 origin_allowed 只放行
#     localhost/127.0.0.1（防 DNS rebinding），代理不改写会全 403
#  3. WebSocket upgrade（/ws 流式事件）
#  4. 静态资源直接由 iris 托管（SPA fallback 在 iris 内），不另配 root
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 17m;   # iris RPC DefaultBodyLimit 16 MiB，留 JSON 开销
  proxy_read_timeout 3600s;   # WS 长连接与流式生成
  proxy_send_timeout 3600s;

  # Docker 内置 DNS：配合变量式 proxy_pass，iris 容器重启换 IP 也能自动重解析
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;

    # basic auth 凭据由 entrypoint 从环境变量生成（IRIS_AUTH_USER/IRIS_AUTH_PASSWORD）
    auth_basic "Iris Creation";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
      # 变量式 proxy_pass：每次请求经 resolver 解析，避免启动期静态解析失败/过期
      set $iris_backend "http://iris:8765";
      proxy_pass $iris_backend;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1;          # 绕过 origin_allowed 的本机校验
      proxy_set_header Origin "";               # 清掉外部 Origin，避免非本机 Origin 被拒
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;   # WS upgrade
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
