name: Build And Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            webui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir webui install --frozen-lockfile
      - name: Check unified version and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/version.mjs check "$RELEASE_TAG"
      - run: node --test scripts/release.test.mjs
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact_name: bundle-windows
          - name: macos
            os: macos-latest
            artifact_name: bundle-macos
          - name: linux
            os: ubuntu-22.04
            artifact_name: bundle-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            webui/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf

      - name: Install JavaScript dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Install JavaScript dependencies (webui)
        run: pnpm --dir webui install --frozen-lockfile

      - name: Generate icon set
        shell: bash
        run: pnpm exec tauri icon src-tauri/icons/icon.png --output src-tauri/icons

      - name: Build Windows/macOS Tauri bundles
        if: matrix.name != 'linux'
        run: pnpm run tauri:build -- --ci

      - name: Build Linux bundles (RPM prerelease version compatibility)
        if: matrix.name == 'linux'
        run: node scripts/build-linux-bundles.mjs

      - name: Build acceptance server
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin iris-creation-server

      - name: Local RPC and mock-provider acceptance
        shell: bash
        run: node scripts/smoke-test.mjs "src-tauri/target/release/iris-creation-server${{ matrix.name == 'windows' && '.exe' || '' }}"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: bundle-*
          merge-multiple: true

      - name: Verify installers and publish without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs release-artifacts
